name: Publish

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 0'

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changed directories
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.get-changes.outputs.matrix }}
      builds: ${{ steps.get-changes.outputs.builds }}
      created: ${{ steps.get-changes.outputs.created }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare matrix
        id: get-changes
        shell: bash
        env:
          BASE_COMMIT: ${{ github.event.before }}
        run: |
          set -euo pipefail

          matrix=$(bash .github/scripts/build-matrix.sh "$BASE_COMMIT" \
            | jq -c 'map(. + {slug: "\(.image | gsub("/"; "-"))-\(.tag)"})')
          builds=$(jq -c '[.[] | . as $variant
            | ({arch: "amd64", runner: "ubuntu-24.04"}, {arch: "arm64", runner: "ubuntu-24.04-arm"})
            | $variant + . + {platform: "linux/\(.arch)"}]' <<< "$matrix")

          {
            echo "matrix=$matrix"
            echo "builds=$builds"
            echo "created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >> "$GITHUB_OUTPUT"
          echo "Build matrix: $matrix"

  build:
    name: Build ${{ matrix.image }}:${{ matrix.tag }} (${{ matrix.arch }})
    needs: detect-changes
    if: needs.detect-changes.outputs.matrix != '[]'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.builds) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          DOCKER_BUILD_SUMMARY: 'false'
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.context }}/Dockerfile
          platforms: ${{ matrix.platform }}
          pull: ${{ github.event_name == 'schedule' }}
          no-cache-filters: ${{ github.event_name == 'schedule' && 'image' || '' }}
          cache-from: ${{ matrix.cache && format('type=gha,scope={0}-{1}', matrix.slug, matrix.arch) || '' }}
          cache-to: ${{ matrix.cache && format('type=gha,scope={0}-{1},mode=max', matrix.slug, matrix.arch) || '' }}
          outputs: type=image,name=ghcr.io/mr-chelyshkin/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.authors=mr-chelyshkin
            org.opencontainers.image.created=${{ needs.detect-changes.outputs.created }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.documentation=${{ github.server_url }}/${{ github.repository }}/tree/main/${{ matrix.context }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.version=${{ matrix.tag }}

      - name: Export digest
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/digest"
          printf '%s\n' "$DIGEST" > "$RUNNER_TEMP/digest/$ARCH"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.slug }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.image }}:${{ matrix.tag }}
    needs: [detect-changes, build]
    if: ${{ !cancelled() && needs.detect-changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: publish-${{ matrix.image }}-${{ matrix.tag }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect-changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Skip superseded image sources
        id: revision
        shell: bash
        env:
          IMAGE_CONTEXT: ${{ matrix.context }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          newer_changes=$(git rev-list --full-history --max-count=1 HEAD..origin/main -- \
            "$IMAGE_CONTEXT" .github/workflows/publish.yml .github/scripts)
          if git merge-base --is-ancestor HEAD origin/main \
            && [[ -z "$newer_changes" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping $IMAGE_CONTEXT: main contains newer image sources or publish logic."
          fi

      - name: Download digests
        if: steps.revision.outputs.publish == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digest-${{ matrix.slug }}-{amd64,arm64}
          path: ${{ runner.temp }}/digest
          merge-multiple: true

      - name: Set up Buildx
        if: steps.revision.outputs.publish == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: steps.revision.outputs.publish == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-platform image
        if: steps.revision.outputs.publish == 'true'
        id: manifest
        shell: bash
        env:
          IMAGE: ghcr.io/mr-chelyshkin/${{ matrix.image }}
          TAG: ${{ matrix.tag }}
          DESCRIPTION: ${{ matrix.description }}
        run: |
          set -euo pipefail

          sources=()
          for arch in amd64 arm64; do
            digest_file="$RUNNER_TEMP/digest/$arch"
            if [[ ! -s "$digest_file" ]]; then
              echo "::error::Missing linux/$arch digest for $IMAGE:$TAG."
              exit 1
            fi
            sources+=("$IMAGE@$(<"$digest_file")")
          done

          docker buildx imagetools create \
            --tag "$IMAGE:$TAG" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            "${sources[@]}"

          digest=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE@$digest"

      - name: Set up Trivy
        if: steps.manifest.outputs.digest != ''
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Report vulnerabilities
        if: ${{ !cancelled() && steps.manifest.outcome == 'success' && steps.manifest.outputs.digest != '' }}
        shell: bash
        env:
          IMAGE_REF: ghcr.io/mr-chelyshkin/${{ matrix.image }}@${{ steps.manifest.outputs.digest }}
          IMAGE_TAG: ${{ matrix.image }}:${{ matrix.tag }}
        run: |
          set -euo pipefail

          printf '## Trivy — %s\n\n`%s`\n\n' "$IMAGE_TAG" "$IMAGE_REF" >> "$GITHUB_STEP_SUMMARY"
          echo 'HIGH/CRITICAL findings, including those without a fix. Counts are package findings, not unique CVEs.' >> "$GITHUB_STEP_SUMMARY"
          status=0
          for arch in amd64 arm64; do
            printf '\n### linux/%s\n\n' "$arch" >> "$GITHUB_STEP_SUMMARY"
            if trivy image --image-src remote --platform "linux/$arch" \
              --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed=false \
              --format template --template @.github/scripts/trivy-summary.tpl \
              --output "$RUNNER_TEMP/trivy-$arch.md" --timeout 15m --exit-code 0 \
              "$IMAGE_REF"; then
              cat "$RUNNER_TEMP/trivy-$arch.md" >> "$GITHUB_STEP_SUMMARY"
            else
              echo '**Scan failed. See the step log; vulnerability status is unknown.**' >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          done
          exit "$status"

  cleanup:
    name: Clean up untagged images
    needs: [detect-changes, publish]
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.detect-changes.outputs.matrix != '[]' }}
    runs-on: ubuntu-24.04
    concurrency:
      group: ghcr-cleanup
      queue: max
      cancel-in-progress: false
    permissions:
      packages: write
    steps:
      - name: Select packages
        id: packages
        shell: bash
        env:
          MATRIX: ${{ needs.detect-changes.outputs.matrix }}
        run: echo "list=$(jq -r '[.[].image] | unique | join(",")' <<< "$MATRIX")" >> "$GITHUB_OUTPUT"

      - name: Delete untagged images
        uses: dataaxiom/ghcr-cleanup-action@d52806a0dc70b430571a37da1fde39733ffd640f # v1.2.2
        with:
          packages: ${{ steps.packages.outputs.list }}
          delete-tags: '*-sha-*'
          delete-untagged: true
          older-than: 1 hour

  keepalive:
    name: Keep schedule enabled
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Re-enable publish workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/enable"
